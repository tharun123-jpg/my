<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src * data: blob:; connect-src * http: https: data:;">
<title>Hyper Suite X</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="app">
  <!-- ============ HEADER ============ -->
  <header id="hdr">
    <div id="hdr-left">
      <div id="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M3 12c2.5-6 5-6 7 0s4.5 6 7 0 4.5-6 4-6" stroke="var(--gold)" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="20.5" cy="6" r="2" fill="var(--gold)"/>
        </svg>
        <span id="logo-name">Hyper&nbsp;Suite&nbsp;<b>X</b></span>
      </div>
      <div id="hdr-menu" title="Menu">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h16" stroke="#8b8f98" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
    </div>
    <div id="hdr-right">
      <div id="credits-chip" title="Credits">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="var(--gold)"/></svg>
        <span id="credits-num">222</span>
      </div>
      <div id="plan-badge" title="Plan: Basic">B</div>
    </div>
  </header>

  <div id="update-banner" class="hidden">
    <span id="update-text">Hyper Suite X 2.0 is available.</span>
    <a id="update-get">Get it</a>
    <a id="update-what">What's new</a>
    <button id="update-x" title="Dismiss">
      <svg width="10" height="10" viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div id="comp-status">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="#8b8f98" stroke-width="1.8"/><path d="m10 9 5 3-5 3V9z" fill="#8b8f98"/></svg>
    <span id="comp-status-text">No composition active. Open one to use the tools.</span>
  </div>

  <!-- ============ BODY ============ -->
  <div id="body">
    <nav id="sidebar">
      <button class="sb-btn" data-view="chat"       title="HyperAI"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M21 12a8 8 0 0 1-8 8H4l2.2-3.3A8 8 0 1 1 21 12z" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M8.5 10.5h7M8.5 13.5h4.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
      <button class="sb-btn" data-view="library"    title="Library"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M5 4h3v16H5zM10.5 4h3v16h-3zM16.8 5.2l2.9.8-4.2 15.2-2.9-.8z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></button>
      <button class="sb-btn" data-view="favorites"  title="Favorites"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="m12 3.5 2.6 5.4 5.9.8-4.3 4.1 1.1 5.8L12 16.9l-5.3 2.7 1.1-5.8-4.3-4.1 5.9-.8L12 3.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      <button class="sb-btn" data-view="transitions" title="Transitions"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg></button>
      <button class="sb-btn" data-view="fx"         title="FX toggles"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="4" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button class="sb-btn" data-view="graph"      title="Ease editor"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 20C9 20 9 4 20 4" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/><circle cx="9" cy="13" r="2.2" fill="currentColor"/><circle cx="15" cy="11" r="2.2" fill="currentColor"/></svg></button>
      <button class="sb-btn" data-view="general"    title="General"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M4 8h10M18 8h2M4 16h4M12 16h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="16" cy="8" r="2.4" stroke="currentColor" stroke-width="1.8"/><circle cx="9" cy="16" r="2.4" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button class="sb-btn" data-view="project"    title="Project"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9.5h17M9 4.5v5M15 19.5v-5" stroke="currentColor" stroke-width="1.8"/></svg></button>
      <button class="sb-btn" data-view="profile"    title="Profile &amp; settings"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.6" stroke="currentColor" stroke-width="1.8"/><path d="M4.5 20c1.4-3.4 4.2-5 7.5-5s6.1 1.6 7.5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </nav>
    <main id="main">
      <section class="view" id="view-chat"><div id="chat-root"></div></section>
      <section class="view hidden" id="view-library"><div id="library-root"></div></section>
      <section class="view hidden" id="view-favorites"><div id="favorites-root"></div></section>
      <section class="view hidden" id="view-transitions"><div id="transitions-root"></div></section>
      <section class="view hidden" id="view-fx"><div id="fx-root"></div></section>
      <section class="view hidden" id="view-graph"><div id="graph-root"></div></section>
      <section class="view hidden" id="view-general"><div id="general-root"></div></section>
      <section class="view hidden" id="view-project"><div id="project-root"></div></section>
      <section class="view hidden" id="view-profile"><div id="profile-root"></div></section>
    </main>
  </div>
</div>

<!-- toast + modal roots -->
<div id="toasts"></div>
<div id="modal-backdrop" class="hidden"><div id="modal-box"></div></div>
<div id="ctx-menu" class="hidden"></div>

<script src="js/brand.js"></script>
<script src="js/bridge.js"></script>
<script src="js/data-presets.js"></script>
<script src="js/sfx.js"></script>
<script src="js/views-chat.js"></script>
<script src="js/views-library.js"></script>
<script src="js/views-transitions.js"></script>
<script src="js/views-general.js"></script>
<script src="js/views-graph.js"></script>
<script src="js/views-fx.js"></script>
<script src="js/views-project.js"></script>
<script src="js/views-profile.js"></script>
<script src="js/app.js"></script>
</body>
</html>
